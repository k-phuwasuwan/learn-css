<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- external -->
    <link rel="stylesheet" href="style.css">
    <!-- internal -->
    <style>
        .inline {
            background-color: blueviolet;

        }
    </style>
</head>

<body>
    <!-- inline -->
    <h1 style="color: chocolate;">this is inline</h1>

    <h1 class="inline">this is internal</h1>
    <h1 class="external">this is external</h1>

    <br><hr><br>

    <div class="margin-box">
        <span class="lable">margin</span>
        <div class="border-box">
            <span class="lable">border</span>
            <div class="padding-box">
                <span class="lable">padding</span>
                <div class="content-box">
                    content
                </div>
            </div>
        </div>
    </div>

    <br><hr><br>

    <!-- Selector -->
    <article>
        <p>I want to be red and larger than the other text.</p>
        <p>I want to be normal sized and the default color.</p>
    </article>

    <br><hr><br>

    <!-- The cascade -->
    <button>Hello, I have blue text</button>

    <h1 class="my-element">Heading</h1>

    <br><hr><br>

    <!-- Specificity -->
     <p id="myId" class="myClass">id < class > tag</p>
     
     <br><hr><br>
     
     <!-- Inheritance -->
    <a href="#" class="my-button">I am a button link</a>
    
    <br><hr><br>

    <!-- Color -->
     <button class="named-colors">This is named colors</button>
     <button class="numeric-colors">This is Numeric colors (HEX , HEX Codes With Alpha)</button>
     <button class="rgba-colors">This is RGBA colors</button>
</body>

</html>
